<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>pokedex</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="background" id="main">
<div id="all">
<div id=pokedex>
    <div id="boxybox">
        <div id="box1">
            <div id="zoekbalk">
                <input id="myForm" type="text"  placeholder="voer hier een naam of id in">
            </div>
            <div id="pokemonachterkant"></div>
        </div>

        <div id="box2">
            <div id="pokemonvoorkant"></div>
        <div class="row" id="naambox">
            <div id="naaminbox"></div>
                <div class="row" id="typesbox">
                    <div id="typebox"></div>
                    <div id="typebox2"></div>
                </div>
            </div>   
            </div>
        <div class="stats">
            <div id="statsbox" class="firstpage"></div>
            <div id="statsbox2" class="firstpage"></div>
            <div id="scrollstats" onclick="statschanger()">️⬇️</div>
            <div class="stack">
                <div id="backpokemon" onclick="backpokemon()"> vorige pokemon</div>
                <div id="nextpokemon" onclick="nextpokemon()"> volgende pokemon</div>
            </div>
        </div>
        </div>
    <div class="overview">
            <div id="overzicht"></div>
    </div>
        </div>
            <script src="pokedex.js"></script>
        </div>
   

</body>
</html>
