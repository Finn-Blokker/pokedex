<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>pokedex</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="background" id="main">

<form>
    <button type="button" onclick="searchpokemon()">search</button>
</form>

<div id="rowrow"></div>

<div id=pokedex>
    <div id="boxybox">
        <div id="imagebox">
            <div id="niks">niks</div>
            <input id="myForm" type="text" placeholder="voer hier een naam of id in">
            <div id="niks1">niks1</div>
            <div id="pokemonvoorkant">voorkant</div>
            <div id="pokemonachterkant">achterkant</div>
            <div id="naampokemon">naam</div>

        </div>
        <div id="tussenbalk">tussenbalk</div>
        <div id="namebox"></div>
        <div id="searchbox"></div>
        <div class="stats">
            <div id="statsbox" class="firstpage"></div>
            <div id="scrollstats">️⬇️</div>
            <div class="stack">
                <div id="backpokemon" onclick="backpokemon()"> vorige pokemon</div>
                <div id="nextpokemon" onclick="nextpokemon()"> volgende pokemon</div>
            </div>
        </div>
    </div>
</div>

<script src="pokedex.js"></script>

</body>
</html>
